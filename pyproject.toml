[project]
name = "support-system-knowledge-agent"
version = "0.12.0"
description = "Offline-first osTicket evidence retrieval with real MCP tools and optional Gemini synthesis."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "mcp>=1.28,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "travel-ops-knowledge-agent"
version = "0.4.0"
description = "Evidence-first travel operations knowledge assistant, with an offline retrieval baseline."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "mcp>=1.28,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
